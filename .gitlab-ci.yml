image: "maven:3-openjdk-18-slim"
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
stages:
  - build
  - test
  - cleanup
cache:
  paths:
    - .m2/repository/
    - target/
before_script:
  - export PATH="$CI_PROJECT_DIR/global_bin:$CI_PROJECT_DIR/src/main/bin:$CI_PROJECT_DIR/src/test/script:$CI_PROJECT_DIR/src/test/script/launchers:$PATH"
build:
  stage: build
  script:
    - mvn $MAVEN_OPTS clean compile

test:initial:
  stage: test
  dependencies:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS exec:exec@test_renduInitial
  only:
    - master
    - develop
    - merge_requests
  artifacts:
      paths:
        - tmp/

test:interm1:
  stage: test
  needs: ["test:initial"]
  script:
    - mvn $MAVEN_CLI_OPTS exec:exec@test_renduIntermediaire1
  only:
    - master
    - develop
    - merge_requests
  artifacts:
      paths:
        - tmp/

test:interm2:
  stage: test
  needs: ["test:interm1"]
  script:
    - mvn $MAVEN_CLI_OPTS exec:exec@test_renduIntermediaire2
  only:
    - master
    - develop
    - merge_requests
  artifacts:
      paths:
        - tmp/

test:summary:
  stage: test
  needs: ["test:interm2"]
  script:
    - mvn $MAVEN_CLI_OPTS exec:exec@summary
  only:
    - master
    - develop
    - merge_requests
  artifacts:
      paths:
        - tmp/

cleanup:
  stage: cleanup
  dependencies:
    - test:summary
  script:
    - mvn $MAVEN_CLI_OPTS clean
  only:
    - master
    - develop
    - merge_requests