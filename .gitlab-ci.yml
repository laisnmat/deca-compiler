image: "maven:3-openjdk-18-slim"
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
stages:
  - build
  - test_renduInitial
  - test_renduIntermediaire1
  - test_renduIntermediaire2
  - summary
cache:
  paths:
    - .m2/repository/
    - target/
before_script:
  - export PATH="$CI_PROJECT_DIR/global_bin:$CI_PROJECT_DIR/src/main/bin:$CI_PROJECT_DIR/src/test/script:$CI_PROJECT_DIR/src/test/script/launchers:$PATH"
build:
  stage: build
  script:
    - mvn $MAVEN_OPTS clean compile

test_renduInitial:
  stage: test_renduInitial
  dependencies:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS exec:exec@test_renduInitial
  only:
    - master
    - develop
    - merge_requests

test_renduIntermediaire1:
  stage: test_renduIntermediaire1
  dependencies:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS exec:exec@test_renduIntermediaire1
  only:
    - master
    - develop
    - merge_requests

test_renduIntermediaire2:
  stage: test_renduIntermediaire2
  dependencies:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS exec:exec@test_renduIntermediaire2
  only:
    - master
    - develop
    - merge_requests

summary:
  stage: summary
  dependencies:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS exec:exec@summary
  only:
    - master
    - develop
    - merge_requests